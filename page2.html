<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motivation Check 🩸</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; font-family: system-ui, sans-serif; background: #000; color: #fff; display: flex; justify-content: center; align-items: center; padding: 20px; text-align: center; }
        .card { max-width: 420px; width: 100%; background: #111; border: 1px solid #333; border-radius: 20px; padding: 30px 20px; }
        h2 { font-size: 1.5rem; margin-bottom: 20px; color: #dc2626; }
        .opt { background: #000; border: 1px solid #333; color: #fff; padding: 16px; border-radius: 12px; width: 100%; margin-bottom: 12px; cursor: pointer; text-align: left; font-size: 1rem; transition: 0.3s; }
        .opt:hover { border-color: #dc2626; }
        #win { display: none; margin-top: 20px; color: #ef4444; font-weight: bold; font-size: 1.1rem; }
        .btn-next { display: none; margin-top: 20px; background: #fff; color: #000; padding: 14px; border-radius: 12px; text-decoration: none; font-weight: 800; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Tu padhai kyu kar rahi hai? 🧠</h2>
        <div id="opts">
            <button class="opt" onclick="alert('Nah, ye weak energy Vidhi ki nahi ho sakti. Try again. 🙄')">A) Kyunki fail hone se darr lagta hai</button>
            <button class="opt" onclick="correct()">B) Un sab ladko ki aukaat dikhane ke liye jo sochte hain wo zyada smart hain</button>
            <button class="opt" onclick="alert('Boring. Baddie ban thoda. Try again. 🥱')">C) Achi job aur future ke liye</button>
        </div>
        <div id="win">Exactly. 💅 Unki ego destroy karni hai kal.</div>
        <a href="page3.html" id="btn-next" class="btn-next">Next Level →</a>
    </div>
    <script>
        function correct() {
            document.getElementById('opts').style.display = 'none';
            document.getElementById('win').style.display = 'block';
            document.getElementById('btn-next').style.display = 'block';
        }
    </script>
</body>
</html>
